<!DOCTYPE html>
<html>
<head>
    <title>Verify QR - HELIX</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="centered-container">
    <div class="orb"></div>

    <div class="card">
        <h2>Verify QR Token</h2>

        <form method="POST">
            <textarea name="token" placeholder="Paste token here" rows="4" required></textarea>
            <button type="submit">Verify</button>
        </form>

        <p class="msg">{{ msg }}</p>

        <a class="link" href="/dashboard">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
