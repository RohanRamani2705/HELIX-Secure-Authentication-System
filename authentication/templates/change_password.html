<!DOCTYPE html>
<html>
<head>
    <title>Change Password - HELIX</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
    function checkStrength() {
        let pw = document.getElementById("new_pw").value;
        let bar = document.getElementById("strength-bar");

        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[a-z]/.test(pw)) score++;
        if (/\d/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        bar.style.width = (score * 20) + "%";
        let colors = ["red", "orange", "yellow", "gold", "lightgreen"];
        bar.style.background = colors[score - 1] || "red";
    }
    </script>
</head>
<body>

<div class="centered-container">
    <div class="orb"></div>

    <div class="card">
        <h2>Change Password</h2>

        <form method="POST">
            <input type="password" name="current_pw" placeholder="Current Password" required>

            <input id="new_pw" type="password" name="new_pw"
                   placeholder="New Password" onkeyup="checkStrength()" required>

            <div style="width:100%; background:#222; height:8px; border-radius:5px; margin-top:5px;">
                <div id="strength-bar"
                     style="height:8px; width:0%; border-radius:5px;"></div>
            </div>

            <input type="password" name="confirm_pw" placeholder="Confirm New Password" required>

            <button type="submit">Update Password</button>
        </form>

        <p class="msg">{{ msg }}</p>

        <a class="link" href="/security_settings">Back to Security Settings</a>
    </div>
</div>

</body>
</html>
